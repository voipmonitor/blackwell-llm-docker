# DeepSeek V4 text/Vision over the shared Jovian Judgement serving stack.
# MODEL_DIR is a locally staged checkpoint directory, mounted read-only.
# DS4_MODEL_VARIANT=vision selects Vision K3; text selects DSpark K5.
services:
  ds4:
    image: ${IMAGE:?Set IMAGE to the source-locked shared serving image}
    container_name: ${NAME:-ds4-jovian}
    entrypoint: [/usr/local/bin/serve-ds4-jovian.sh]
    network_mode: host
    ipc: host
    init: true
    restart: "no"
    ulimits:
      memlock: {soft: -1, hard: -1}
      stack: 67108864
    environment:
      CUDA_VISIBLE_DEVICES: "0,1"
      MODEL: /model
      DS4_MODEL_VARIANT: ${DS4_MODEL_VARIANT:-text}
      PORT: ${PORT:-8000}
      TP_SIZE: "2"
      DCP_SIZE: "1"
      BACKEND: ${BACKEND:-b12x-a8-dglin}
      MAX_MODEL_LEN: ${MAX_MODEL_LEN:--1}
      MAX_NUM_BATCHED_TOKENS: ${MAX_NUM_BATCHED_TOKENS:-4096}
      GPU_MEMORY_UTILIZATION: ${GPU_MEMORY_UTILIZATION:-}
      DS4_OMP_NUM_THREADS: ${DS4_OMP_NUM_THREADS:-2}
      DS4_MAX_CUDAGRAPH_CAPTURE_SIZE: ${DS4_MAX_CUDAGRAPH_CAPTURE_SIZE:-auto}
      DS4_CUDAGRAPH_CAPTURE_SIZES: ${DS4_CUDAGRAPH_CAPTURE_SIZES:-default}
      GLOO_SOCKET_IFNAME: ${GLOO_SOCKET_IFNAME:-lo}
      NCCL_SOCKET_IFNAME: ${NCCL_SOCKET_IFNAME:-lo}
      NCCL_MIN_NCHANNELS: "16"
      NCCL_MAX_NCHANNELS: "16"
      NCCL_BUFFSIZE: "2097152"
      LMCACHE_MODE: ${LMCACHE_MODE:-off}
      LMCACHE_TRANSFER_MODE: ${LMCACHE_TRANSFER_MODE:-engine_driven}
      LMCACHE_L1_GB: ${LMCACHE_L1_GB:-24}
      LMCACHE_CHUNK_SIZE: "4096"
      LMCACHE_SEPARATE_OBJECT_GROUPS: "1"
      LMCACHE_PORT: ${LMCACHE_PORT:-5555}
      LMCACHE_HTTP_PORT: ${LMCACHE_HTTP_PORT:-8099}
      LMCACHE_L2_PATH: /cache/lmcache/ds4
      LMCACHE_L2_GB: ${LMCACHE_L2_GB:-256}
    volumes:
      - ${MODEL_DIR:?Set MODEL_DIR to a DeepSeek V4 checkpoint}:/model:ro
      - ds4-cache:/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_0:-0}", "${GPU_1:-1}"]
              capabilities: [gpu]
volumes:
  ds4-cache:
